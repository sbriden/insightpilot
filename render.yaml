# InsightPilot on Render (Railway-compatible Docker layout).
#
# Deploy: push this repo, then in Render → New → Blueprint → select repo.
# After first deploy, set ADMIN_PASSWORD / OPENAI_* in the dashboard.
#
# Data refresh (NFL/CFB) is synchronous and can take many minutes.
# Use Render Shell on the api service, or call refresh with a long
# client timeout — platform HTTP timeouts may kill the request.
#
# Custom domains for published apps: add each domain on the `web`
# service in Render, then set custom_domain on the application in studio.

databases:
  - name: insightpilot-db
    plan: free
    databaseName: insightpilot
    user: insightpilot

services:
  - type: web
    name: insightpilot-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: insightpilot-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: INSIGHTPILOT_AI_ENABLED
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: insightpilot-web
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: API_URL
        sync: false
      - key: NEXT_PUBLIC_PRIMARY_HOSTS
        sync: false
      - key: NEXT_PUBLIC_REQUIRE_ADMIN_AUTH
        value: "1"
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: PORT
        value: "3000"
